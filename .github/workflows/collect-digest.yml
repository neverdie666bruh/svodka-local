# Ежедневный сбор на стандартном публичном runner. Артефактов и кэша нет.
# Расписание живёт на ветке по умолчанию. Коммит в data этим workflow
# не запускает его снова: триггера push нет, а push от GITHUB_TOKEN
# не создаёт новый run.
name: Collect digest

on:
  schedule:
    - cron: "15 8 * * *"
      timezone: "Asia/Dushanbe"
  workflow_dispatch:
    inputs:
      force:
        description: "Пересобрать выпуск текущей даты"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: svodka-local-digest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Require a public repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/require-public-repo.sh

      - name: Collect and push the data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          SVODKA_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true && 'true' || 'false' }}
        run: bash scripts/publish-data-branch.sh
